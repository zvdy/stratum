name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "internal/**"
      - "cmd/**"
      - "testdata/**"
  workflow_dispatch:

# Deploys are serialized and never cancelled mid-flight; PR builds are
# grouped per PR so a new push supersedes the previous check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Dogfood: regenerate the "Live example" page with the freshly built
      # binary so the published site always reflects the current parser.
      - name: Regenerate live example with stratum itself
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o /tmp/stratum ./cmd/stratum
          /tmp/stratum --migrations-path testdata/migrations --output docs/example.md --verbose

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Build MkDocs site
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must be enabled once with Source = "GitHub Actions"
      # (Settings -> Pages). The default token cannot enable it itself.
      - uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
