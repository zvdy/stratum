name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment at a time; don't cancel a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # Dogfood: regenerate the "Live example" page with the freshly built
      # binary so the published site always reflects the current parser.
      - name: Regenerate live example with stratum itself
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o /tmp/stratum ./cmd/stratum
          /tmp/stratum --migrations-path testdata/migrations --output docs/example.md --verbose

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build MkDocs site
        run: |
          pip install mkdocs-material
          mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages for the repo on first run if it isn't already.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
