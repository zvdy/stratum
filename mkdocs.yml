site_name: stratum
site_description: Static PostgreSQL migrations → Mermaid ERD. No database, no cgo, no network.
site_url: https://zvdy.github.io/stratum/
repo_url: https://github.com/zvdy/stratum
repo_name: zvdy/stratum
edit_uri: edit/main/docs/
copyright: stratum · static ERDs from PostgreSQL migrations

theme:
  name: material
  logo: stratum-logo.png
  favicon: stratum-logo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  palette:
    # Follows the OS setting until the reader picks a scheme.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow system theme
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zvdy/stratum
      name: stratum on GitHub

nav:
  - Home: index.md
  - Usage: usage.md
  - GitHub Action: github-action.md
  - Parser: parser.md
  - Live example: example.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid fences as live diagrams — stratum's whole output
        # format — instead of code blocks.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
