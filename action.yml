# stratum — GitHub composite Action
#
# Generates a Mermaid ERD (embedded in Markdown) from PostgreSQL migration
# files, with no database connection. The caller is responsible for checking out
# the repository (actions/checkout) before invoking this action.
#
# This composite action builds the binary from source using the Go toolchain.
# For faster runs you can instead download a prebuilt binary from a GitHub
# Release: replace the "Build stratum" step below with a curl/tar step that
# fetches the release asset for the runner's OS/arch and places it on PATH.
#
# Example usage:
#
#   - uses: actions/checkout@v4
#   - uses: zvdy/stratum@v1
#     with:
#       migrations-path: db/migrations
#       output: SCHEMA.md
#       schema: public
#       push: "true"
#
name: stratum
description: Generate a Mermaid ERD in Markdown from PostgreSQL migration files (no DB connection).
branding:
  icon: layers
  color: blue

inputs:
  migrations-path:
    description: Path to the migrations directory (required).
    required: true
  output:
    description: Output file path.
    required: false
    default: SCHEMA.md
  schema:
    description: Filter output to this schema name.
    required: false
    default: public
  recursive:
    description: Discover .sql files recursively.
    required: false
    default: "false"
  push:
    description: If "true", git add + commit + push the output file.
    required: false
    default: "false"
  commit-message:
    description: Commit message used with push.
    required: false
    default: "chore: update schema docs"
  verbose:
    description: Log each parsed statement.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25"

    # Builds the binary from this action's source checkout. stratum is pure Go
    # (hand-written SQL parser), so no C toolchain is required.
    - name: Build stratum
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        CGO_ENABLED=0 go build -o "${RUNNER_TEMP}/stratum" ./cmd/stratum

    - name: Run stratum
      shell: bash
      run: |
        ARGS=(--migrations-path "${{ inputs.migrations-path }}" \
              --output "${{ inputs.output }}" \
              --schema "${{ inputs.schema }}" \
              --commit-message "${{ inputs.commit-message }}")
        [ "${{ inputs.recursive }}" = "true" ] && ARGS+=(--recursive)
        [ "${{ inputs.push }}" = "true" ] && ARGS+=(--push)
        [ "${{ inputs.verbose }}" = "true" ] && ARGS+=(--verbose)
        "${RUNNER_TEMP}/stratum" "${ARGS[@]}"
